async function api(path, { method = "GET", token, body, prefer } = {}) {
  const h = { apikey: ANON, "Content-Type": "application/json" };
  if (token) h.Authorization = `Bearer ${token}`;
  if (prefer) h.Prefer = prefer;
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  const t = await res.text(); const d = t ? JSON.parse(t) : null;
  if (!res.ok) throw new Error((d && (d.message || d.hint)) || "資料庫錯誤");
  return d;
}
async function edge(name, payload, token) {
  const h = { apikey: ANON, "Content-Type": "application/json" };
  if (token) h.Authorization = `Bearer ${token}`;
  const res = await fetch(`${SUPA_URL}/functions/v1/${name}`, { method: "POST", headers: h, body: JSON.stringify(payload || {}) });
  const d = await res.json(); if (!res.ok) throw new Error(d.error || "操作失敗"); return d;
}
async function authToken(grant, body) {
  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=${grant}`, { method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await res.json(); if (!res.ok) throw new Error(d.error_description || d.msg || d.error || "登入失敗"); return d;
}
async function authUser(token) {
  const res = await fetch(`${SUPA_URL}/auth/v1/user`, { headers: { apikey: ANON, Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error("session-expired"); return res.json();
}
async function compressImage(file, maxSide = 1600, quality = 0.82) {
  if (!file || !file.type?.startsWith("image/")) return file;
  try {
    const bitmap = await (window.createImageBitmap ? createImageBitmap(file) : new Promise((res, rej) => {
      const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file);
    }));
    const w0 = bitmap.width || bitmap.naturalWidth;
    const h0 = bitmap.height || bitmap.naturalHeight;
    const scale = Math.min(1, maxSide / Math.max(w0, h0));
    const w = Math.round(w0 * scale), h = Math.round(h0 * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", quality));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], "shot.jpg", { type: "image/jpeg" });
  } catch (e) { return file; }
}
async function uploadShot(file, uid, token) {
  const f = await compressImage(file);
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("讀取檔案失敗"));
    r.readAsDataURL(f);
  });
  const res = await fetch(`${SUPA_URL}/functions/v1/upload-asset`, {
    method: "POST", headers: { apikey: ANON, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ bucket: "payment-screenshots", ext: "jpg", base64: b64, contentType: "image/jpeg" }),
  });
  const d = await res.json();
  if (!res.ok) throw new Error(d.error || "截圖上傳失敗");
  return d.path;
}

const SESS_KEY = "yq_user_session_v2";
const SESS_TTL = 30 * 24 * 60 * 60 * 1000; // 30 天

const ssave = (s) => {
  try {
    const payload = { ...s, saved_at: Date.now() };
    localStorage.setItem(SESS_KEY, JSON.stringify(payload));
  } catch (e) {}
};
const sload = () => {
  try {
    const raw = localStorage.getItem(SESS_KEY);
    if (!raw) return null;
    const payload = JSON.parse(raw);
    // 過期檢查
    if (payload.saved_at && Date.now() - payload.saved_at > SESS_TTL) {
      localStorage.removeItem(SESS_KEY);
      return null;
    }
    return payload;
  } catch (e) { return null; }
};
const sclear = () => { try { localStorage.removeItem(SESS_KEY); } catch (e) {} };

// ── 推廣連結追蹤（業務員系統）────────────────────────────────────────────────
const VTOK_KEY = "yq_vtok";
const PROMO_KEY = "yq_promo_code";
const PROMO_TS_KEY = "yq_promo_ts";
const PROMO_TTL = 30 * 24 * 60 * 60 * 1000; // 30 天

// 取得（或生成）訪客識別 token
function getVisitorToken() {
  try {
    let t = localStorage.getItem(VTOK_KEY);
    if (!t) {
      t = "v_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(VTOK_KEY, t);
    }
    return t;
  } catch (e) { return "v_anon"; }
}
// 取出 URL ?ref=xxx，存進 localStorage，並通知後端記錄點擊
async function detectPromoFromUrl() {
  try {
    const url = new URL(window.location.href);
    const ref = (url.searchParams.get("ref") || "").trim().toLowerCase();
    if (!ref) return;
    // 移除 URL 中的 ref 參數讓網址乾淨（但仍保留 localStorage 中的綁定）
    url.searchParams.delete("ref");
    window.history.replaceState({}, "", url.toString());
    // 寫入 localStorage
    localStorage.setItem(PROMO_KEY, ref);
    localStorage.setItem(PROMO_TS_KEY, String(Date.now()));
    // 通知後端記錄點擊（無需登入）
    try {
      await edge("referral-public", { action: "trackClick", promo_code: ref, visitor_token: getVisitorToken() });
    } catch (e) { /* 失敗不阻塞 */ }
  } catch (e) {}
}
function loadPromoCode() {
  try {
    const ts = Number(localStorage.getItem(PROMO_TS_KEY) || 0);
    if (ts && Date.now() - ts > PROMO_TTL) {
      localStorage.removeItem(PROMO_KEY); localStorage.removeItem(PROMO_TS_KEY); return "";
    }
    return localStorage.getItem(PROMO_KEY) || "";
  } catch (e) { return ""; }
}

}

  const creditTwd = useCredit ? Number(st.credit_per_order) : 0;
  const pointsTwd = pointsUsed / Number(st.points_per_nt);
  const price = Number(st.price_per_kg);
  if (deliveryType === "711") {
    const freight = weight * price * Number(st.rate_twd), dispatch = Number(st.fee_711);
    return { currency: "TWD", symbol: "NT$",
      lines: [{ label: `運費　${weight}kg × ${price} × ${st.rate_twd}`, val: freight }, { label: "7-11 派件費", val: dispatch }],
      discounts: [...(couponTwd ? [{ label: "優惠券", val: -couponTwd }] : []), ...(creditTwd ? [{ label: "額度折抵", val: -creditTwd }] : []), ...(pointsUsed ? [{ label: `積分折抵（${pointsUsed}分）`, val: -pointsTwd }] : [])],
      total: round2(Math.max(0, freight + dispatch - couponTwd - creditTwd - pointsTwd)) };
  }
  const freight = weight * price, dispatch = Number(st.fee_home) / Number(st.rate_rmb), rate = Number(st.rate_rmb);
  return { currency: "RMB", symbol: "¥",
    lines: [{ label: `運費　${weight}kg × ${price}`, val: freight }, { label: `宅配派件費　${st.fee_home}元 ÷ ${rate}`, val: dispatch }],
    discounts: [...(couponTwd ? [{ label: `優惠券（${couponTwd}元 ÷ ${rate}）`, val: -couponTwd / rate }] : []), ...(creditTwd ? [{ label: `額度折抵（${creditTwd}元 ÷ ${rate}）`, val: -creditTwd / rate }] : []), ...(pointsUsed ? [{ label: `積分折抵（${pointsUsed}分 ÷ ${rate}）`, val: -(pointsUsed / Number(st.points_per_nt)) / rate }] : [])],
    total: round2(Math.max(0, freight + dispatch - (couponTwd + creditTwd + pointsTwd) / rate)) };
}

const STATUS_LABEL = { pending: "待到倉", arrived: "已到倉", abnormal: "異常", packed: "已打包", shipped: "已出貨" };
const STATUS_COLOR = { pending: "chip-grey", arrived: "chip-sea", abnormal: "chip-alert", packed: "chip-leaf", shipped: "chip-leaf" };
const ORDER_STATUS = { awaiting_payment: "待付款", payment_review: "待確認付款", packing: "打包中", shipped: "已出貨", completed: "已完成", cancelled: "已取消" };

function App() {
  const [booting, setBooting] = useState(true);
  const [sess, setSess] = useState(null);
  const [appUser, setAppUser] = useState(null);
  const [settings, setSettings] = useState(null);
  const [addresses, setAddresses] = useState([]);
  const [packages, setPackages] = useState([]);
  const [orders, setOrders] = useState([]);
  const [screen, setScreen] = useState("home");
  const [toast, setToast] = useState("");
  const [selectedIds, setSelectedIds] = useState([]);
  const [draft, setDraft] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [notifs, setNotifs] = useState([]);
  const [showBell, setShowBell] = useState(false);
  // 業務員系統
  const [mySalesperson, setMySalesperson] = useState(null);   // 用戶綁定的業務員（含 use_custom_rates 等）
  const [contact, setContact] = useState(null);                // 客服聯絡資訊
  const [showCs, setShowCs] = useState(false);                 // 客服彈窗

  const flash = (m) => { setToast(m); setTimeout(() => setToast(""), 2600); };

  useEffect(() => {
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap";
    document.head.appendChild(l);
    (async () => {
      // 1. 先偵測網址中的推廣碼，並寫入 localStorage + 通知後端
      await detectPromoFromUrl();
      // 2. 還原登入 session
      const s = sload();
      if (s?.access_token) {
        try {
          const u = await authUser(s.access_token);
          await bootData(s.access_token, u.id, s.refresh_token);
        } catch (e) {
          if (s.refresh_token) {
            try {
              const r = await authToken("refresh_token", { refresh_token: s.refresh_token });
              ssave(r);
              const u = await authUser(r.access_token);
              await bootData(r.access_token, u.id, r.refresh_token);
            } catch { sclear(); }
          } else sclear();
        }
      }
      // 3. 載入聯絡資訊（無論登入與否，未登入時走 localStorage 的 promo_code）
      try {
        const promo = loadPromoCode();
        if (promo) {
          const r = await edge("referral-public", { action: "resolveContact", promo_code: promo });
          if (r?.contact) setContact(r.contact);
        }
      } catch (e) {}
      setBooting(false);
    })();
  }, []);

  async function bootData(token, uid, refresh) {
    const [u, st] = await Promise.all([
      api(`app_users?auth_user_id=eq.${uid}&select=*`, { token }),
      api(`settings?id=eq.1&select=*`, { token }),
    ]);
    if (!u?.[0]) throw new Error("no-user");
    setSess({ token, uid, refresh });
    setAppUser(u[0]); setSettings(st[0]);
    // 抓業務員資料（如果有歸屬）
    if (u[0].referred_by_salesperson_id) {
      try {
        const r = await edge("referral-public", { action: "resolveContact", salesperson_id: u[0].referred_by_salesperson_id });
        if (r?.contact) setContact(r.contact);
        // 拉業務員費率資訊
        const sps = await api(`salespersons?id=eq.${u[0].referred_by_salesperson_id}&select=id,name,use_custom_rates,custom_price_per_kg,custom_rate_rmb,custom_rate_twd,custom_fee_home,custom_fee_711&is_active=eq.true`, { token });
        if (sps?.[0]) setMySalesperson(sps[0]);
      } catch (e) {}
    } else {
      // 沒有業務員 → 用預設客服
      try {
        const r = await edge("referral-public", { action: "resolveContact" });
        if (r?.contact) setContact(r.contact);
      } catch (e) {}
    }
    await Promise.all([reloadAddresses(token, u[0].id), reloadPackages(token, u[0].id), reloadOrders(token, u[0].id)]);
  }
  const reloadUser = async () => { const u = await api(`app_users?auth_user_id=eq.${sess.uid}&select=*`, { token: sess.token }); setAppUser(u[0]); };
  const reloadAddresses = async (token = sess.token, uid = appUser.id) => setAddresses(await api(`recipient_addresses?user_id=eq.${uid}&select=*&order=created_at.asc`, { token }));
  const reloadPackages = async (token = sess.token, uid = appUser.id) => setPackages(await api(`packages?user_id=eq.${uid}&select=*&order=created_at.desc`, { token }));
  const reloadOrders = async (token = sess.token, uid = appUser.id) => setOrders(await api(`shipments?user_id=eq.${uid}&select=*&order=created_at.desc`, { token }));

  const onAuthed = async (session, user) => {
    ssave(session);
    const uid = (await authUser(session.access_token)).id;
    const [stRows, addrs, pkgs, ords, notifsRows] = await Promise.all([
      api(`settings?id=eq.1&select=*`, { token: session.access_token }),
      api(`recipient_addresses?user_id=eq.${user.id}&select=*&order=created_at.asc`, { token: session.access_token }).catch(() => []),
      api(`packages?user_id=eq.${user.id}&select=*&order=created_at.desc`, { token: session.access_token }).catch(() => []),
      api(`shipments?user_id=eq.${user.id}&select=*&order=created_at.desc`, { token: session.access_token }).catch(() => []),
      api(`notifications?user_id=eq.${user.id}&select=*&order=created_at.desc&limit=30`, { token: session.access_token }).catch(() => []),
    ]);
    setSettings(stRows && stRows[0] ? stRows[0] : null);
    setAddresses(addrs || []);
    setPackages(pkgs || []);
    setOrders(ords || []);
    setNotifs(notifsRows || []);
    setAppUser(user);
    setSess({ token: session.access_token, uid, refresh: session.refresh_token });
    // 業務員資訊
    if (user.referred_by_salesperson_id) {
      try {
        const r = await edge("referral-public", { action: "resolveContact", salesperson_id: user.referred_by_salesperson_id });
        if (r?.contact) setContact(r.contact);
        const sps = await api(`salespersons?id=eq.${user.referred_by_salesperson_id}&select=id,name,use_custom_rates,custom_price_per_kg,custom_rate_rmb,custom_rate_twd,custom_fee_home,custom_fee_711&is_active=eq.true`, { token: session.access_token });
        if (sps?.[0]) setMySalesperson(sps[0]);
      } catch (e) {}
    } else {
      try {
        const r = await edge("referral-public", { action: "resolveContact" });
        if (r?.contact) setContact(r.contact);
      } catch (e) {}
    }
    setScreen("home");
  };
  const logout = () => { sclear(); setSess(null); setAppUser(null); setSettings(null); setPackages([]); setOrders([]); setAddresses([]); setNotifs([]); setMySalesperson(null); setScreen("home"); };

  // 自動同步：每 8 秒輪詢，且切換到 home/packages/orders 時立即刷新
  useEffect(() => {
    if (!sess || !appUser) return;
    let alive = true;
    const refresh = async () => {
      try {
        const [u, p, o, n] = await Promise.all([
          api(`app_users?id=eq.${appUser.id}&select=*`, { token: sess.token }),
          api(`packages?user_id=eq.${appUser.id}&select=*&order=created_at.desc`, { token: sess.token }),
          api(`shipments?user_id=eq.${appUser.id}&select=*&order=created_at.desc`, { token: sess.token }),
          api(`notifications?user_id=eq.${appUser.id}&select=*&order=created_at.desc&limit=30`, { token: sess.token }),
        ]);
        if (!alive) return;
        if (u?.[0]) setAppUser(u[0]);
        setPackages(p); setOrders(o); setNotifs(n || []);
      } catch (e) {}
    };
    refresh();
    const t = setInterval(refresh, 8000);
    const onVis = () => { if (document.visibilityState === "visible") refresh(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { alive = false; clearInterval(t); document.removeEventListener("visibilitychange", onVis); };
  }, [sess?.token, appUser?.id, screen]);

  if (booting) return (<div className="phone-wrap"><div className="phone"><div className="boot">載入中…</div></div></div>);
  if (!sess || !appUser) return (
    <div className="phone-wrap"><style>{CSS}</style><div className="phone">
      <div className="view"><Auth onAuthed={onAuthed} flash={flash} /></div>
      <CsFab onClick={() => setShowCs(true)} />
      {showCs && <CsPanel contact={contact} onClose={() => setShowCs(false)} flash={flash} />}
    </div></div>
  );
  // 進入主介面但設定還沒就緒：顯示載入畫面（避免子元件因 settings 為 null 而崩潰）
  if (!settings) return (<div className="phone-wrap"><style>{CSS}</style><div className="phone"><div className="boot">載入中…</div></div></div>);

  // 套用業務員自訂費率（如有）— 用戶端所有計費都看這個 st
  const st = applySalespersonRates(settings, mySalesperson);
  const unread = notifs.filter((n) => !n.is_read).length;
  const openImage = (src) => src && setLightbox(src);
  const markAllRead = async () => {
    if (!unread) return;
    try {
      await api(`notifications?user_id=eq.${appUser.id}&is_read=eq.false`, { token: sess.token, method: "PATCH", prefer: "return=minimal", body: { is_read: true } });
      setNotifs((ns) => ns.map((n) => ({ ...n, is_read: true })));
    } catch (e) {}
  };
  const goFromNotif = (n) => {
    setShowBell(false);
    if (n.kind === "payment_returned") setScreen("orders");
    else if (n.kind === "package_arrived") setScreen("packages");
    else if (n.kind === "shipped" || n.kind === "paid") setScreen("orders");
  };

  const ctx = { sess, appUser, settings: st, addresses, packages, orders, setScreen, flash, draft, setDraft, selectedIds, setSelectedIds, reloadUser, reloadAddresses, reloadPackages, reloadOrders, startConsolidate, logout, openImage, openPayment, mySalesperson, contact, openCs: () => setShowCs(true) };

  function startConsolidate() {
    const arrived = packages.filter((p) => p.status === "arrived");
    setSelectedIds(arrived.map((p) => p.id));
    setDraft({ deliveryType: "home", recipientId: addresses[0]?.id || null, coupon: "", couponApplied: null, useCredit: appUser.credit_balance >= Number(st.credit_per_order), usePoints: false });
    setScreen("consolidate");
  }

  // 用戶被退回付款後，從訂單列表進入再付款
  function openPayment(order) {
    const calc = {
      currency: order.currency, symbol: order.currency === "TWD" ? "NT$" : "¥",
      lines: [], discounts: [], total: Number(order.freight_amount),
    };
    setDraft({
      retryShipmentId: order.id, retry: true,
      deliveryType: order.delivery_type, recipientId: null,
      calc, weight: Number(order.total_weight),
      items: [],
    });
    setScreen("payment");
  }

  const mainScreens = ["home", "packages", "orders", "profile"];
  const showNav = mainScreens.includes(screen);

  return (
    <div className="phone-wrap">
      <style>{CSS}</style>
      <div className="phone">
        <button className="bell" onClick={() => setShowBell(true)} aria-label="通知">
          <span>🔔</span>
          {unread > 0 && <em className="bell-dot">{unread > 9 ? "9+" : unread}</em>}
        </button>
        <div className="view">
          {screen === "home" && <Home ctx={ctx} />}
          {screen === "estimator" && <Estimator ctx={ctx} />}
          {screen === "add" && <AddPackage ctx={ctx} />}
          {screen === "packages" && <Packages ctx={ctx} />}
          {screen === "consolidate" && <Consolidate ctx={ctx} />}
          {screen === "payment" && <Payment ctx={ctx} />}
          {screen === "orders" && <Orders ctx={ctx} />}
          {screen === "profile" && <Profile ctx={ctx} />}
          {screen === "invite" && <Invite ctx={ctx} />}
          {screen === "about" && <About ctx={ctx} />}
          {screen === "addAddress" && <AddAddress ctx={ctx} />}
          {screen === "storePicker" && <StorePicker ctx={ctx} />}
        </div>
        {showNav && (
          <div className="tabbar">
            <button className={screen === "home" ? "on" : ""} onClick={() => setScreen("home")}><span>⌂</span>首頁</button>
            <button className={screen === "packages" ? "on" : ""} onClick={() => setScreen("packages")}><span>📦</span>包裹</button>
            <button className="fab" onClick={startConsolidate}>＋</button>
            <button className={screen === "orders" ? "on" : ""} onClick={() => setScreen("orders")}><span>📍</span>進度</button>
            <button className={screen === "profile" ? "on" : ""} onClick={() => setScreen("profile")}><span>☺</span>我的</button>
          </div>
        )}
        {showBell && <NotifPanel notifs={notifs} onClose={() => { markAllRead(); setShowBell(false); }} onClickItem={goFromNotif} />}
        {lightbox && <Lightbox src={lightbox} onClose={() => setLightbox(null)} />}
        {toast && <div className="toast">{toast}</div>}
        <CsFab onClick={() => setShowCs(true)} hide={screen === "consolidate" || screen === "payment" || screen === "addAddress" || screen === "storePicker"} />
        {showCs && <CsPanel contact={contact} onClose={() => setShowCs(false)} flash={flash} />}
      </div>
    </div>
  );
}

function Lightbox({ src, onClose }) {
  return (
    <div className="lightbox" onClick={onClose}>
      <button className="lb-close" onClick={onClose} aria-label="關閉">✕</button>
      <img src={src} alt="放大檢視" />
    </div>
  );
}

// ── 浮動客服按鈕（右下角）────────────────────────────────────────────────────

  return (
    <button className="cs-fab" onClick={onClick} aria-label="在線客服" title="在線客服">
      <span className="cs-fab-ic">💬</span>
      <span className="cs-fab-dot"></span>
    </button>

// ── 客服彈窗 / 聯絡方式選單 ─────────────────────────────────────────────────
function CsPanel({ contact, onClose, flash }) {
  const [showWxQr, setShowWxQr] = useState(false);
  const c = contact || {};
  const copy = async (text, label) => {
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
      else { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
      flash?.(`已複製${label || ""}`);
    } catch { flash?.("複製失敗"); }
  };
  const openLine = () => {
    if (!c.line_id) return flash?.("LINE 尚未設定");
    window.open(`https://line.me/ti/p/~${encodeURIComponent(c.line_id)}`, "_blank");
  };
  const openWhatsApp = () => {
    if (!c.whatsapp) return flash?.("WhatsApp 尚未設定");
    const num = String(c.whatsapp).replace(/[^0-9]/g, "");
    window.open(`https://wa.me/${num}`, "_blank");
  };
  const handleWechat = () => {
    if (!c.wechat) return flash?.("微信尚未設定");
    setShowWxQr(true);
  };
  return (
    <div className="cs-wrap" onClick={onClose}>
      <div className="cs-panel" onClick={(e) => e.stopPropagation()}>
        <div className="cs-head">
          <div>
            <div className="cs-title">在線客服</div>
            <div className="cs-sub">{c.source === "salesperson" ? `您的專屬顧問 · ${c.name || ""}` : "雲橋集運 客服中心"}</div>
          </div>
          <button className="cs-close" onClick={onClose} aria-label="關閉">✕</button>
        </div>
        <div className="cs-body">
          {!showWxQr ? (
            <>
              <p className="cs-tip">選擇您方便的方式聯絡我們，我們會儘快回覆。</p>
              <button className="cs-item wechat" onClick={handleWechat} disabled={!c.wechat}>
                <span className="cs-ic">💚</span>
                <div className="cs-item-body">
                  <b>微信</b>
                  <span>{c.wechat || "未設定"}</span>
                </div>
                <span className="cs-arrow">›</span>
              </button>
              <button className="cs-item line" onClick={openLine} disabled={!c.line_id}>
                <span className="cs-ic">💬</span>
                <div className="cs-item-body">
                  <b>LINE</b>
                  <span>{c.line_id ? "點擊加為好友" : "未設定"}</span>
                </div>
                <span className="cs-arrow">›</span>
              </button>
              <button className="cs-item whatsapp" onClick={openWhatsApp} disabled={!c.whatsapp}>
                <span className="cs-ic">📱</span>
                <div className="cs-item-body">
                  <b>WhatsApp</b>
                  <span>{c.whatsapp || "未設定"}</span>
                </div>
                <span className="cs-arrow">›</span>
              </button>
              <div className="cs-foot-tip">💡 點擊即可跳轉到對應 App 加好友</div>
            </>
          ) : (
            <div className="cs-wx-view">
              <button className="cs-back" onClick={() => setShowWxQr(false)}>← 返回</button>
              <div className="cs-wx-title">微信加好友</div>
              {c.wechat_qr_url ? (
                <img className="cs-wx-qr" src={c.wechat_qr_url} alt="微信二維碼" />
              ) : (
                <div className="cs-wx-noqr">
                  <div className="cs-wx-emoji">💚</div>
                  <div className="cs-wx-text">請使用微信搜尋以下 ID 加好友</div>
                </div>
              )}
              <div className="cs-wx-id-row">
                <span className="cs-wx-label">微信號</span>
                <span className="mono cs-wx-id">{c.wechat}</span>
                <button className="cs-wx-copy" onClick={() => copy(c.wechat, "微信號")}>複製</button>
              </div>
              <div className="cs-wx-help">📱 截圖或長按上方二維碼<br/>或開啟微信 → 搜尋 → 貼上微信號</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function NotifPanel({ notifs, onClose, onClickItem }) {
  const ICON = { payment_returned: "⚠️", package_arrived: "📦", shipped: "🚚", paid: "💰" };
  return (

      <div className="notif-panel" onClick={(e) => e.stopPropagation()}>

            <button className={"notif " + (n.is_read ? "" : "unread")} key={n.id} onClick={() => onClickItem(n)}>

function BackTitle({ title, onBack, setScreen }) {
  return (<div className="bt"><button className="back" onClick={onBack || (() => setScreen("home"))}>‹</button><h2>{title}</h2></div>);
}

function Auth({ onAuthed, flash }) {
  const [mode, setMode] = useState("register");
  const [username, setUsername] = useState("");
  const [country, setCountry] = useState(COUNTRIES[0].code);
  const [phone, setPhone] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [invite, setInvite] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [promoSp, setPromoSp] = useState(null);  // 業務員推廣訊息

  // 啟動時檢查 localStorage 是否有業務員推廣碼，並查業務員姓名顯示
  useEffect(() => {
    const promo = loadPromoCode();
    if (promo) {
      edge("referral-public", { action: "resolveContact", promo_code: promo })
        .then(r => { if (r?.contact?.source === "salesperson") setPromoSp(r.contact); })
        .catch(() => {});
    }
  }, []);

  const submit = async () => {
    setErr(""); setBusy(true);
    try {
      const c = COUNTRIES.find((x) => x.code === country);
      if (mode === "register") {
        if (username.trim().length < 2) throw new Error("請輸入用戶名（至少 2 字）");
        if (!/^\d{6,15}$/.test(phone)) throw new Error("請輸入正確手機號碼（6–15 位數字）");
        if (pw.length < 4) throw new Error("密碼至少 4 碼");
        if (pw !== pw2) throw new Error("兩次密碼不一致");
        const r = await edge("user-register", {
          username: username.trim(), country: c.name, country_code: c.code,
          phone, password: pw, invite_code: invite,
          promo_code: loadPromoCode(),                    // 業務員推廣碼
          visitor_token: getVisitorToken(),                // 訪客識別
        });
        await onAuthed(r.session, r.app_user);
        flash("註冊成功，已送 200 元運費額度 🎁");
      } else {
        if (!/^\d{6,15}$/.test(phone)) throw new Error("請輸入正確手機號碼");
        const email = emailFor(c.code, phone);
        const s = await authToken("password", { email, password: pw });
        const u = await authUser(s.access_token);
        const au = await api(`app_users?auth_user_id=eq.${u.id}&select=*`, { token: s.access_token });
        if (!au?.[0]) throw new Error("查無此帳號");
        await onAuthed({ access_token: s.access_token, refresh_token: s.refresh_token }, au[0]);
        flash("歡迎回來");
      }
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return (
    <div className="auth">
      <div className="brand"><div className="logo-plate"><img src={LOGO_FULL} alt="雲橋集運" /></div><p className="tag">連接中國供應鏈與全球生活</p></div>
      <div className="card auth-card">
        <div className="seg">
          <button className={mode === "register" ? "on" : ""} onClick={() => { setMode("register"); setErr(""); }}>註冊</button>
          <button className={mode === "login" ? "on" : ""} onClick={() => { setMode("login"); setErr(""); }}>登入</button>
        </div>
        {mode === "register" && promoSp && (
          <div className="promo promo-sp">🎯 由業務員 <b>{promoSp.name}</b> 為您推薦註冊</div>
        )}
        {mode === "register" && <div className="promo">首次註冊送 <b>200 元</b> 運費額度，邀請好友再賺積分</div>}
        {mode === "register" && (<label className="fld"><span>用戶名</span><input placeholder="例：小明" value={username} onChange={(e) => setUsername(e.target.value)} /></label>)}
        <label className="fld"><span>手機號碼</span>
          <div className="phone-row">
            <select value={country} onChange={(e) => setCountry(e.target.value)}>{COUNTRIES.map((c) => <option key={c.code} value={c.code}>{c.flag} {c.name} {c.code.replace("-CA", "")}</option>)}</select>
            <input inputMode="numeric" placeholder="手機號碼" value={phone} onChange={(e) => setPhone(e.target.value)} />
          </div>
        </label>
        <label className="fld"><span>密碼</span><input type="password" placeholder="輸入密碼" value={pw} onChange={(e) => setPw(e.target.value)} /></label>
        {mode === "register" && (<label className="fld"><span>確認密碼</span><input type="password" placeholder="再次輸入密碼" value={pw2} onChange={(e) => setPw2(e.target.value)} /></label>)}
        {mode === "register" && (<label className="fld"><span>邀請碼（選填）</span><input className="mono" placeholder="朋友的邀請碼" value={invite} onChange={(e) => setInvite(e.target.value)} /></label>)}
        {err && <div className="err">{err}</div>}
        <button className="btn primary block" disabled={busy} onClick={submit}>{busy ? "處理中…" : mode === "register" ? "註冊並領取額度" : "登入"}</button>
        <p className="hint">支援台灣、中國、馬來西亞、澳洲、美國、新加坡、泰國、加拿大手機號。</p>
      </div>
    </div>
  );
}

function CreditCard({ u, st }) {

function WarehouseCard({ u, st, flash }) {
  const [open, setOpen] = useState(false);
  const [copied, setCopied] = useState("");
  if (!u || !st) return null;
  // 收件人直接用用戶名（每個用戶看到的是自己的名字），不再顯示會員編號
  const userName = u.username || "";
  const fill = (txt) => String(txt || "").replace(/\s*\+?\s*您的會員編號/g, ` ${userName}`).trim();
  // 收件人只顯示用戶自己的名字，倉庫憑名字認領包裹
  const recipient = userName;
  const phone = String(st.warehouse_phone || "").trim();
  const address = fill(st.warehouse_address || "");
  const note = String(st.warehouse_note || "").trim();
  if (!address && !recipient) return null;

  const copy = async (text, key) => {
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
      else { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
      setCopied(key); setTimeout(() => setCopied(""), 1800);
      flash?.("已複製！");
    } catch (e) { flash?.("複製失敗"); }
  };
  const copyAll = (e) => {
    e.stopPropagation();
    const full = `收件人：${recipient}${phone ? "\n電話：" + phone : ""}\n地址：${address}`;
    copy(full, "all");
  };

  const rows = [
    { key: "recipient", label: "收件人", val: recipient, mono: false },
    ...(phone ? [{ key: "phone", label: "電話", val: phone, mono: true }] : []),
    { key: "address", label: "地址", val: address, mono: false },
  ];

  return (
    <div className="wh-card">
      {/* 收合狀態：標題列 */}
      <button className="wh-trigger" onClick={() => setOpen(v => !v)}>
        <div className="wh-trigger-left">
          <span className="wh-icon">🏭</span>
          <div>
            <div className="wh-trigger-title">大陸倉庫收件地址</div>
            <div className="wh-trigger-sub">下單時填寫此地址，包裹寄達後集運到台灣</div>
          </div>
        </div>
        <div className="wh-trigger-right">
          {!open && <button className="wh-copy-pill" onClick={copyAll}>一鍵複製</button>}
          <span className={"wh-chevron" + (open ? " up" : "")}>{open ? "▲" : "▼"}</span>
        </div>
      </button>

      {/* 展開內容 */}
      {open && (
        <div className="wh-body">
          {rows.map(r => (
            <div className="wh-row" key={r.key}>
              <span className="wh-k">{r.label}</span>
              <span className={"wh-v" + (r.mono ? " mono" : "")}>{r.val}</span>
              <button className={"wh-copy-btn" + (copied === r.key ? " done" : "")} onClick={() => copy(r.val, r.key)}>
                {copied === r.key ? "✓ 已複製" : "複製"}
              </button>
            </div>
          ))}
          {note && <div className="wh-note">💡 {note}</div>}
          <button className="wh-copy-all-btn" onClick={copyAll}>
            {copied === "all" ? "✓ 已複製全部地址" : "📋 一鍵複製完整地址"}
          </button>
        </div>
      )}
    </div>
  );
}

  const [w, setW] = useState("1.0");

  const calc = weight > 0 ? calcFreight({ weight: round2(weight), deliveryType: type, st }) : null;

    <div className="pad">
      <BackTitle title="運費試算" setScreen={setScreen} />

  const upd = (k, key, v) => setRows((r) => r.map((x) => x.k === k ? { ...x, [key]: v } : x));

    try {
      await api("packages", { token: sess.token, method: "POST", prefer: "return=minimal", body: valid.map((r) => ({ user_id: appUser.id, product_name: r.product, tracking_no: r.tracking, status: "pending" })) });
      await reloadPackages(); flash(`已錄入 ${valid.length} 筆包裹`); setScreen("packages");

    <div className="pad">

          <label className="fld"><span>大陸快遞單號</span><input className="mono" placeholder="例：SF1234567890" value={r.tracking} onChange={(e) => upd(r.k, "tracking", e.target.value)} /></label>

function Packages({ ctx }) {
  const { sess, packages, setScreen, flash, reloadPackages } = ctx;
  const [busy, setBusy] = useState(false);
  // 每個包裹獨立的查詢狀態：key = package.id
  const [trackMap, setTrackMap] = useState({});
  const [carrierMap, setCarrierMap] = useState({});
  const [openMap, setOpenMap] = useState({});  // 展開查詢面板

  const queryTrack = async (pkgId, trackingNo, carrier) => {
    const no = (trackingNo || "").trim();
    if (no.length < 5) return flash("快遞單號太短，請確認");
    setTrackMap(p => ({ ...p, [pkgId]: { loading: true } }));
    try {
      const r = await edge("track-parcel", { tracking_no: no, carrier: carrier || "" }, sess.token);
      setTrackMap(p => ({ ...p, [pkgId]: { loading: false, result: r } }));
    } catch (e) {
      setTrackMap(p => ({ ...p, [pkgId]: { loading: false, err: e.message } }));
    }
  };

  return (
    <div className="pad">
      <BackTitle title="我的包裹" setScreen={setScreen} />
      {packages.length === 0 && <div className="empty big">還沒有包裹。<br />到「錄入包裹」加入第一筆吧。</div>}
      {packages.map((p) => {
        const ts = trackMap[p.id];
        const isOpen = openMap[p.id];
        const carrier = carrierMap[p.id] || "";
        // 快遞鳥直接回傳 items 陣列，state 為物流狀態碼
        const items = ts?.result?.items || [];
        const apiMsg = ts?.result?.error || "";
        const isSuggest = ts?.result?.suggest || false;
        const stateMap = {
          "0":"暫無軌跡", "1":"已攬件", "2":"在途中", "3":"已簽收",
          "4":"問題件", "5":"退件中", "6":"已退回", "401":"無記錄",
        };
        const stateLabel = ts?.result?.state ? (stateMap[ts.result.state] || `狀態${ts.result.state}`) : null;
        return (
          <div key={p.id}>
            <ParcelTag p={p} openImage={ctx.openImage} />
            {p.tracking_no && (
              <div className="pkg-track-wrap">
                <button
                  className={"pkg-track-toggle" + (isOpen ? " open" : "")}
                  onClick={() => setOpenMap(m => ({ ...m, [p.id]: !m[p.id] }))}
                >
                  📡 查詢大陸快遞動態 {isOpen ? "▲" : "▼"}
                </button>
                {isOpen && (
                  <div className="domestic-tracker">
                    {/* 快遞單號顯示 */}
                    <div className="dt-trackno">單號　<span className="mono">{p.tracking_no}</span></div>
                    {/* 選快遞公司 + 查詢按鈕 */}
                    <div className="dt-row">
                      <select
                        className="dt-select"
                        value={carrier}
                        onChange={e => setCarrierMap(m => ({ ...m, [p.id]: e.target.value }))}
                      >
                        <option value="">🔍 自動識別（推薦）</option>
                        <option disabled>── 或手動選擇 ──</option>
                        {CARRIER_OPTIONS.map(c => <option key={c.val} value={c.val}>{c.label}</option>)}
                      </select>
                    </div>
                    <button
                      className="dt-btn"
                      disabled={ts?.loading}
                      onClick={() => queryTrack(p.id, p.tracking_no, carrier)}
                    >
                      {ts?.loading ? "⏳ 識別快遞公司並查詢中…" : "查詢物流動態"}
                    </button>
                    {/* 錯誤 */}
                    {ts?.err && (
                      <div className="dt-err">
                        {ts.err}
                        {isSuggest && <div style={{marginTop:4}}>👆 請從上方下拉選單手動選擇快遞公司後重試</div>}
                      </div>
                    )}
                    {/* 查詢成功結果 */}
                    {ts && !ts.loading && ts.result && !ts.err && (
                      <div className="dt-result">
                        <div className="dt-meta-row">
                          {ts.result.carrierName && (
                            <span className="dt-carrier-tag">📦 {ts.result.carrierName}</span>
                          )}
                          {stateLabel && (
                            <span className={"dt-state-tag" + (ts.result.state === "3" ? " delivered" : ts.result.state === "4" ? " problem" : "")}>
                              {stateLabel}
                            </span>
                          )}
                        </div>
                        {items.length > 0 ? (
                          items.slice(0, 8).map((it, idx) => (
                            <div className="dt-item" key={idx}>
                              <div className="dt-time">{it.ftime}</div>
                              <div className="dt-context">{it.context}</div>
                            </div>
                          ))
                        ) : (
                          <div className="dt-empty">
                            {apiMsg || "暫無物流動態，通常下單後 4–12 小時才可查到"}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
      <button className="btn ghost block" onClick={() => setScreen("add")}>＋ 錄入新包裹</button>
    </div>
  );
}

function Consolidate({ ctx }) {
  const { sess, appUser, settings: st, packages, addresses, setScreen, flash, draft, setDraft, selectedIds, setSelectedIds } = ctx;
  const arrived = packages.filter((p) => p.status === "arrived");
  const sel = arrived.filter((p) => selectedIds.includes(p.id));
  const weight = round2(sel.reduce((s, p) => s + Number(p.weight || 0), 0));
  const over = weight > Number(st.max_weight_711);
  const homeAddrs = addresses.filter((a) => a.type === "home");
  const storeAddrs = addresses.filter((a) => a.type === "711");
  const d = draft || {};
  useEffect(() => { if (over && d.deliveryType === "711") setDraft((x) => ({ ...x, deliveryType: "home" })); }, [over]);

  const [coupon, setCoupon] = useState("");
  const couponTwd = d.couponApplied ? Number(d.couponApplied.discount_twd) : 0;
  const redeemable = Math.floor((appUser.points || 0) / 10) * 10;
  const pointsUsed = d.usePoints ? redeemable : 0;
  const useCredit = d.useCredit && appUser.credit_balance >= Number(st.credit_per_order);
  const calc = calcFreight({ weight, deliveryType: d.deliveryType, st, couponTwd, useCredit, pointsUsed });
  const recipientList = d.deliveryType === "home" ? homeAddrs : storeAddrs;
  const recipient = recipientList.find((a) => a.id === d.recipientId) || recipientList[0];

  const applyCoupon = async () => {
    const code = coupon.trim().toUpperCase(); if (!code) return;
    try {
      const c = await api(`coupons?code=eq.${code}&is_active=eq.true&select=*`, { token: sess.token });
      if (!c?.[0]) return flash("優惠券無效或已停用");
      const cp = c[0];
      if (cp.usage_limit != null && cp.used_count >= cp.usage_limit) return flash("此優惠券名額已滿");
      const r = await api(`coupon_redemptions?coupon_id=eq.${cp.id}&user_id=eq.${appUser.id}&select=id`, { token: sess.token });
      if (r && r.length) return flash("此優惠券你已使用過，一人僅能用一次");
      setDraft((x) => ({ ...x, couponApplied: cp }));
      flash(`已套用：${cp.label || cp.code}（NT$${Number(cp.discount_twd)}）`);
    } catch (e) { flash(e.message); }
  };
  const toPay = () => {
    if (!sel.length) return flash("請選擇要集運的包裹");
    if (!recipient) return flash(`請先新增${d.deliveryType === "home" ? "宅配地址" : "7-11 門市"}`);
    setDraft((x) => ({ ...x, recipientId: recipient.id, calc, weight, items: sel, pointsUsed, useCredit }));
    setScreen("payment");
  };

  return (
    <div className="pad">
      <BackTitle title="集運出貨" setScreen={setScreen} />
      <div className="sec-title">選擇包裹（{sel.length}/{arrived.length}）</div>
      {arrived.length === 0 && <div className="empty">目前沒有「已到倉」的包裹。包裹到倉後即可集運。</div>}
      {arrived.map((p) => {
        const on = selectedIds.includes(p.id);
        return (<div key={p.id} className={"pick " + (on ? "on" : "")} onClick={() => setSelectedIds((s) => on ? s.filter((i) => i !== p.id) : [...s, p.id])}>
          <div className={"ck " + (on ? "ck-on" : "")}>{on ? "✓" : ""}</div>
          <div className="pick-body"><div className="pick-top"><b>{p.product_name}</b><span className="mono">{p.weight} kg</span></div><div className="mono small">{p.tracking_no} · 貨架 {p.shelf_code}</div></div>
        </div>);
      })}
      <div className="weight-box"><span>本次總重量</span><b className="mono">{weight} kg</b></div>

      <div className="sec-title">運回方式</div>
      <div className="ship-opts">
        <button className={"ship " + (d.deliveryType === "home" ? "on" : "")} onClick={() => setDraft((x) => ({ ...x, deliveryType: "home", recipientId: homeAddrs[0]?.id || null }))}><b>宅配到府</b><span>派件費 NT${Number(st.fee_home)} · 付人民幣</span></button>
        <button className={"ship " + (d.deliveryType === "711" ? "on" : "") + (over ? " disabled" : "")} disabled={over} onClick={() => !over && setDraft((x) => ({ ...x, deliveryType: "711", recipientId: storeAddrs[0]?.id || null }))}><b>7-11 取貨</b><span>{over ? "超過 5kg 不可選" : `派件費 NT$${Number(st.fee_711)} · 付台幣`}</span></button>
      </div>
      {over && <div className="warn">⚠️ 本次包裹超過 {Number(st.max_weight_711)} 公斤，只能選擇宅配到府。</div>}

      <div className="sec-title">{d.deliveryType === "home" ? "宅配地址" : "取貨門市"}<button className="link" onClick={() => setScreen(d.deliveryType === "home" ? "addAddress" : "storePicker")}>＋ 新增</button></div>
      {recipientList.length === 0 && <div className="empty">尚未設定，請點右上「＋ 新增」</div>}
      {recipientList.map((a) => (
        <div key={a.id} className={"radio-card " + (recipient?.id === a.id ? "on" : "")} onClick={() => setDraft((x) => ({ ...x, recipientId: a.id }))}>
          {a.type === "home" ? <><b>{a.receiver_name} · {a.phone}</b><div className="small">{a.detail}</div></> : <><b>7-11 {a.store_name}門市</b><div className="small">{a.receiver_name} · {a.phone}</div><div className="small">{a.store_addr}</div></>}
        </div>
      ))}

      <div className="sec-title">優惠券</div>
      <div className="coupon-row"><input className="mono" placeholder="輸入優惠券編號" value={coupon} onChange={(e) => setCoupon(e.target.value)} /><button className="btn" onClick={applyCoupon}>套用</button></div>
      {d.couponApplied && <div className="ok">✓ 已套用 {d.couponApplied.label}（{Number(d.couponApplied.discount_twd)} 元）</div>}

      {appUser.credit_balance >= Number(st.credit_per_order) && (
        <label className="switch"><input type="checkbox" checked={!!d.useCredit} onChange={(e) => setDraft((x) => ({ ...x, useCredit: e.target.checked }))} /><span>使用運費額度折抵 {Number(st.credit_per_order)} 元（剩 NT${appUser.credit_balance}）</span></label>
      )}
      {redeemable >= 10 && (
        <label className="switch"><input type="checkbox" checked={!!d.usePoints} onChange={(e) => setDraft((x) => ({ ...x, usePoints: e.target.checked }))} /><span>使用積分折抵 {redeemable} 分（＝NT${round2(redeemable / 10)}，共 {appUser.points} 分）</span></label>
      )}

      <Receipt calc={calc} st={st} />
      <button className="btn primary block" onClick={toPay}>前往付款</button>
    </div>
  );
}

function Receipt({ calc, st }) {
  // 取出匯率資訊，給用戶解釋運費明細裡的「× 4.7」「× 4.8」「÷ 4.8」是什麼
  const rateRmb = st ? Number(st.rate_rmb) : null;
  const rateTwd = st ? Number(st.rate_twd) : null;
  return (
    <div className="receipt">
      <div className="receipt-h">運費明細（{calc.currency}）</div>
      {calc.lines.map((l, i) => <div className="rl" key={i}><span>{l.label}</span><span className="mono">{calc.symbol}{round2(l.val)}</span></div>)}
      {calc.discounts.map((l, i) => <div className="rl disc" key={"d" + i}><span>{l.label}</span><span className="mono">-{calc.symbol}{round2(-l.val)}</span></div>)}
      <div className="perf" />
      <div className="rl total"><span>應付金額</span><span className="mono">{calc.symbol}{calc.total}</span></div>
      <div className="round-note">＊金額已四捨五入至小數點後 2 位</div>
      {st && (
        <div className="rate-note">
          💱 <b>匯率說明</b>：明細中的「× {rateTwd}」「× {rateRmb}」「÷ {rateRmb}」是<b>人民幣 ⇄ 新台幣</b>的換算匯率。
          {calc.currency === "TWD"
            ? <>付台幣時用 7-11 匯率 <b>1 RMB = {rateTwd} TWD</b>，把人民幣運費換算成台幣。</>
            : <>付人民幣時用宅配匯率 <b>1 RMB = {rateRmb} TWD</b>，把台幣派件費/優惠換算成人民幣。</>}
          匯率以實際下單當下為準。
        </div>
      )}
    </div>
  );
}

function Payment({ ctx }) {
  const { sess, settings: st, setScreen, flash, draft, reloadUser, reloadPackages, reloadOrders } = ctx;
  const d = draft; const is711 = d.deliveryType === "711";
  const [method, setMethod] = useState(is711 ? "pickup" : "alipay");
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const needUpload = method === "alipay" || method === "wechat";
  const qr = method === "alipay" ? st.payment_qr_alipay_url : st.payment_qr_wechat_url;

  // 結算幣別：711 + pickup => TWD；其他 => RMB
  // 711 用戶若改選支付寶/微信，會自動切到 RMB 結算（用宅配匯率）
  const settleCurrency = (is711 && method === "pickup") ? "TWD" : "RMB";
  const baseWeight = Number(d.weight) || 0;
  const baseCouponTwd = d.couponApplied ? Number(d.couponApplied.discount_twd) : 0;
  const basePointsUsed = Number(d.pointsUsed) || 0;
  const baseUseCredit = !!d.useCredit;
  // 注意：calcFreight 內部以 deliveryType 區分結算幣別。當 711 改付 RMB 時，借用 "home" 的算法（RMB 結算）但派件費仍以 TWD 為基準（fee_711），所以這裡需要自訂計算。
  const calc = (() => {
    if (settleCurrency === "TWD") {
      // 沿用原本 711 TWD 算法
      return calcFreight({ weight: baseWeight, deliveryType: "711", st, couponTwd: baseCouponTwd, useCredit: baseUseCredit, pointsUsed: basePointsUsed });
    }
    // RMB 結算：可能是宅配（fee_home）或 711 改付 RMB（fee_711），都用 rate_rmb 換算
    const price = Number(st.price_per_kg);
    const rate = Number(st.rate_rmb);
    const feeTwd = is711 ? Number(st.fee_711) : Number(st.fee_home);
    const creditTwd = baseUseCredit ? Number(st.credit_per_order) : 0;
    const pointsTwd = basePointsUsed / Number(st.points_per_nt);
    const freight = baseWeight * price;
    const dispatch = feeTwd / rate;
    const lines = [
      { label: `運費　${baseWeight}kg × ¥${price}`, val: freight },
      { label: `${is711 ? "7-11" : "宅配"}派件費　NT$${feeTwd} ÷ ${rate}`, val: dispatch },
    ];
    const discounts = [
      ...(baseCouponTwd ? [{ label: `優惠券（NT$${baseCouponTwd} ÷ ${rate}）`, val: -baseCouponTwd / rate }] : []),
      ...(creditTwd ? [{ label: `額度折抵（NT$${creditTwd} ÷ ${rate}）`, val: -creditTwd / rate }] : []),
      ...(basePointsUsed ? [{ label: `積分折抵（${basePointsUsed}分 ÷ ${rate}）`, val: -(pointsTwd) / rate }] : []),
    ];
    const total = round2(Math.max(0, freight + dispatch - (baseCouponTwd + creditTwd + pointsTwd) / rate));
    return { currency: "RMB", symbol: "¥", lines, discounts, total };
  })();

  const onFile = (e) => { const f = e.target.files?.[0]; if (f) { setFile(f); setPreview(URL.createObjectURL(f)); } };
  const submit = async () => {
    if (needUpload && !file) return flash("請上傳付款截圖");
    setBusy(true);
    try {
      let path = null;
      if (needUpload) path = await uploadShot(file, sess.uid, sess.token);
      if (d.retry && d.retryShipmentId) {
        await edge("retry-payment", { shipment_id: d.retryShipmentId, payment_method: method, payment_screenshot_path: path }, sess.token);
      } else {
        await edge("create-shipment", {
          package_ids: d.items.map((p) => p.id), delivery_type: d.deliveryType, recipient_id: d.recipientId,
          coupon_code: d.couponApplied?.code || null, use_credit: !!d.useCredit, points_to_use: d.pointsUsed || 0,
          payment_method: method, payment_screenshot_path: path,
        }, sess.token);
      }
      await Promise.all([reloadUser(), reloadPackages(), reloadOrders()]);
      flash(d.retry ? "已重新提交付款" : "已提交，待管理端確認付款後開始打包");
      setScreen("orders");
    } catch (e) { flash(e.message); }
    setBusy(false);
  };

  return (
    <div className="pad">
      <BackTitle title={d.retry ? "重新付款" : "付款"} onBack={() => setScreen(d.retry ? "orders" : "consolidate")} setScreen={setScreen} />
      <Receipt calc={calc} st={st} />
      {d.retry && <div className="warn">⚠️ 先前的付款截圖未通過確認，請重新付款並上傳新的截圖。</div>}
      <div className="sec-title">付款方式</div>
      {is711 && <div className={"radio-card " + (method === "pickup" ? "on" : "")} onClick={() => setMethod("pickup")}><b>7-11 門市取貨付款</b><div className="small">到 7-11 取貨時直接付給門市 NT${calc.currency === "TWD" ? calc.total : "—"}（台幣結算）</div></div>}
      <div className={"radio-card " + (method === "alipay" ? "on" : "")} onClick={() => setMethod("alipay")}><b>支付寶轉帳</b><div className="small">下載收款碼 → 轉帳 → 上傳截圖{is711 ? "（自動切換為人民幣結算）" : ""}</div></div>
      <div className={"radio-card " + (method === "wechat" ? "on" : "")} onClick={() => setMethod("wechat")}><b>微信轉帳</b><div className="small">下載收款碼 → 轉帳 → 上傳截圖{is711 ? "（自動切換為人民幣結算）" : ""}</div></div>
      {is711 && method !== "pickup" && (
        <div className="info-tip">ℹ️ 你選了 7-11 取貨 + {method === "alipay" ? "支付寶" : "微信"}付款，金額已改用人民幣結算（匯率 1 RMB = {st.rate_rmb} TWD）。到門市取貨時不需再付款。</div>
      )}
      {needUpload && (
        <div className="qr-box">
          {qr ? <img className="qr-img" src={qr} alt="收款碼" /> : <div className="qr" style={{ "--c": method === "alipay" ? "#1677ff" : "#09bb07" }}><div className="qr-grid" /><div className="qr-cap">管理員尚未上傳{method === "alipay" ? "支付寶" : "微信"}收款碼</div></div>}
          <label className="upload">{preview ? <img src={preview} alt="screenshot" /> : <span>＋ 上傳付款截圖</span>}<input type="file" accept="image/*" onChange={onFile} hidden /></label>
        </div>
      )}
      <button className="btn primary block" disabled={busy} onClick={submit}>{busy ? "提交中…" : needUpload ? (d.retry ? "重新提交付款" : "我已付款，提交出貨") : "確認，到店付款"}</button>
    </div>
  );
}

function Orders({ ctx }) {
  const { sess, orders, setScreen, openImage, openPayment, flash } = ctx;
  if (!orders.length) return (<div className="pad"><BackTitle title="進度追蹤" setScreen={setScreen} /><div className="empty big">還沒有出貨單。<br />到「集運出貨」提交第一筆吧。</div></div>);

  const copyNo = async (no) => {
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(no);
      else { const ta = document.createElement("textarea"); ta.value = no; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
      flash("已複製物流單號");
    } catch { flash("複製失敗"); }
  };

  const getTrackUrl = (carrier, no) => {
    if (!no) return null;
    const c = String(carrier || "").toLowerCase();
    if (c.includes("新竹") || c.includes("hct")) return "https://www.hct.com.tw/Search/SearchGoods_n.aspx";
    if (c.includes("黑貓") || c.includes("t-cat") || c.includes("tcat")) return "https://www.t-cat.com.tw/inquire/trace.aspx";
    if (c.includes("7-eleven") || c.includes("7eleven") || c.includes("711")) return "https://eservice.7-11.com.tw/e-tracking/search.aspx";
    return null;
  };
  const getCarrierLabel = (o) => o.return_carrier || (o.delivery_type === "711" ? "7-ELEVEN" : "新竹物流");

  return (
    <div className="pad">
      <BackTitle title="進度追蹤" setScreen={setScreen} />
      {orders.map((o) => {
        const carrier = getCarrierLabel(o);
        const trackUrl = getTrackUrl(carrier, o.return_tracking_no);
        return (
          <div className="order" key={o.id}>
            <div className="order-h">
              <span className="mono">{o.order_no}</span>
              <span className={"chip " + (o.status === "shipped" || o.status === "completed" ? "chip-leaf" : o.status === "packing" ? "chip-sea" : o.status === "payment_review" ? "chip-sea" : o.status === "awaiting_payment" ? "chip-alert" : "chip-grey")}>{ORDER_STATUS[o.status] || o.status}</span>
            </div>
            <div className="order-meta">{new Date(o.created_at).toLocaleString("zh-TW")} · {o.delivery_type === "home" ? "宅配到府" : "7-11 取貨"} · {o.total_weight}kg</div>
            <div className="order-pay"><span>付款金額</span><b className="mono">{o.currency === "TWD" ? "NT$" : "¥"}{o.freight_amount}</b></div>
            {o.status === "awaiting_payment" && (
              <>
                <div className="alert-box">⚠️ {o.payment_screenshot_url ? "先前的付款截圖未通過，請重新付款並上傳新的截圖。" : "此訂單尚未付款，請完成付款。"}</div>
                <button className="btn primary block" onClick={() => openPayment(o)}>立即重新付款</button>
              </>
            )}
            {o.status === "payment_review" && <div className="note-3d">⏳ 付款截圖已上傳，財務確認後將進入打包。</div>}
            {o.status === "packing" && <div className="note-3d">📦 已收到付款，倉庫打包中。</div>}
            {o.status === "shipped" && (
              <div className="ship-block">
                {o.outbound_photo_url && <img className="out-photo" src={o.outbound_photo_url} alt="出貨包裹" onClick={() => openImage(o.outbound_photo_url)} />}
                {o.return_tracking_no && (
                  <>
                    <div className="rl"><span>物流商</span><span><b>{carrier}</b></span></div>
                    <div className="rl track-no-row">
                      <span>物流單號</span>
                      <span className="track-no-right">
                        <span className="mono">{o.return_tracking_no}</span>
                        <button className="copy-no-btn" onClick={() => copyNo(o.return_tracking_no)}>複製</button>
                      </span>
                    </div>
                    {trackUrl && (
                      <a href={trackUrl} target="_blank" rel="noopener noreferrer" className="track-link-btn">
                        🔍 前往 {carrier} 查詢物流動態 →
                      </a>
                    )}
                  </>
                )}
                {o.shipped_at && <div className="rl"><span>出貨時間</span><span>{new Date(o.shipped_at).toLocaleString("zh-TW")}</span></div>}
                <div className="note-3d" style={{marginTop:8}}>ℹ️ 物流單號通常需 3–4 天，才能在台灣物流系統查到動態。</div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

      <button className="btn ghost block" onClick={logout}>登出</button>

function AddAddress({ ctx }) {
  const { sess, appUser, setScreen, flash, draft, setDraft, reloadAddresses } = ctx;
  const [f, setF] = useState({ name: "", phone: "", detail: "" });
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (!f.name || !f.phone || !f.detail) return flash("請完整填寫");
    setBusy(true);
    try {
      const r = await api("recipient_addresses", { token: sess.token, method: "POST", prefer: "return=representation", body: { user_id: appUser.id, type: "home", receiver_name: f.name, phone: f.phone, detail: f.detail } });
      await reloadAddresses();
      if (draft) setDraft((x) => ({ ...x, recipientId: r[0].id, deliveryType: "home" }));
      flash("已新增宅配地址"); setScreen(draft ? "consolidate" : "profile");
    } catch (e) { flash(e.message); }
    setBusy(false);
  };
  return (
    <div className="pad">
      <BackTitle title="新增宅配地址" onBack={() => setScreen(draft ? "consolidate" : "profile")} setScreen={setScreen} />
      <label className="fld"><span>收件人</span><input value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} /></label>
      <label className="fld"><span>電話</span><input inputMode="numeric" value={f.phone} onChange={(e) => setF({ ...f, phone: e.target.value })} /></label>
      <label className="fld"><span>地址</span><input value={f.detail} onChange={(e) => setF({ ...f, detail: e.target.value })} /></label>
      <button className="btn primary block" disabled={busy} onClick={save}>{busy ? "儲存中…" : "儲存"}</button>
    </div>
  );
}

function StorePicker({ ctx }) {
  const { sess, appUser, setScreen, flash, draft, setDraft, reloadAddresses } = ctx;
  const [region, setRegion] = useState("全部");
  const [district, setDistrict] = useState("");
  const [q, setQ] = useState("");
  const [showAll, setShowAll] = useState(false);
  const [showAllDist, setShowAllDist] = useState(false);
  const [picked, setPicked] = useState(null);
  const [rname, setRname] = useState(appUser.username || "");
  const [rphone, setRphone] = useState(appUser.phone || "");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const CAP = 80;
  const chooseRegion = (r) => { setRegion(r); setDistrict(""); setShowAllDist(false); };
  const k = q.trim();
  let result;
  if (k) { result = STORES.filter((s) => s.name.includes(k) || s.addr.includes(k) || s.id.includes(k)).sort((a, b) => (b.name.includes(k) ? 1 : 0) - (a.name.includes(k) ? 1 : 0)); }
  else { result = region === "全部" ? STORES : STORES.filter((s) => s.region === region); if (district) result = result.filter((s) => s.district === district); }
  const list = result.slice(0, CAP);
  const chips = showAll ? REGIONS : REGIONS.slice(0, 6);
  const allD = region !== "全部" ? districtsFor(region) : [];
  const distChips = showAllDist ? allD : allD.slice(0, 8);
  const browsing = !k;

  const confirm = async () => {
    setErr("");
    if (!rname.trim()) return setErr("請填寫取貨人姓名");
    if (!/^\d{6,15}$/.test(rphone.replace(/\D/g, ""))) return setErr("請填寫正確的取貨手機號");
    setBusy(true);
    try {
      const r = await api("recipient_addresses", { token: sess.token, method: "POST", prefer: "return=representation", body: { user_id: appUser.id, type: "711", store_id: picked.id, store_name: picked.name, store_addr: picked.addr, receiver_name: rname.trim(), phone: rphone.trim() } });
      await reloadAddresses();
      if (draft) setDraft((x) => ({ ...x, recipientId: r[0].id, deliveryType: "711" }));
      flash(`已新增 7-11 ${picked.name}門市`); setScreen(draft ? "consolidate" : "profile");
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  if (picked) {
    return (
      <div className="pad">
        <BackTitle title="取貨人資料" onBack={() => setPicked(null)} setScreen={setScreen} />
        <div className="card">
          <span className="chip chip-leaf">7-11 取貨門市</span>
          <div style={{ marginTop: 8 }}><b>{picked.name} 門市</b><div className="small">📍 {picked.addr}</div><div className="mono small">店號 {picked.id}</div></div>
          <button className="link" onClick={() => setPicked(null)}>← 重新選擇門市</button>
        </div>
        <p className="lead">7-11 取貨需填寫取貨人姓名與手機（到店取貨核對身分、到貨簡訊通知用）。</p>
        <label className="fld"><span>取貨人姓名</span><input value={rname} onChange={(e) => setRname(e.target.value)} placeholder="需與證件相符" /></label>
        <label className="fld"><span>取貨手機</span><input inputMode="numeric" value={rphone} onChange={(e) => setRphone(e.target.value)} placeholder="例：0912345678" /></label>
        {err && <div className="err">{err}</div>}
        <button className="btn primary block" disabled={busy} onClick={confirm}>{busy ? "新增中…" : "確認新增門市"}</button>
      </div>
    );
  }

  return (
    <div className="pad sp">
      <BackTitle title="選擇 7-11 門市" onBack={() => setScreen(draft ? "consolidate" : "profile")} setScreen={setScreen} />
      <div className="sp-head">
        <div className="sp-search"><span className="sp-ic">🔍</span><input placeholder="搜尋門市名稱、店號，或地址（例：土城區學府路）" value={q} onChange={(e) => setQ(e.target.value)} />{q && <button className="sp-clear" onClick={() => setQ("")}>✕</button>}</div>
        <div className="sp-label">{browsing ? "① 選擇縣市" : "關鍵詞搜尋中"}</div>
        <div className="sp-regions">
          <button className={"sp-region " + (region === "全部" ? "on" : "")} onClick={() => chooseRegion("全部")}>全部 <i>{STORES.length.toLocaleString()}</i></button>
          {chips.map((r) => <button key={r} className={"sp-region " + (region === r ? "on" : "")} onClick={() => chooseRegion(r)}>{r} <i>{REGION_COUNT[r]}</i></button>)}
          <button className="sp-region more" onClick={() => setShowAll((v) => !v)}>{showAll ? "收合 ▴" : "更多 ▾"}</button>
        </div>
        {browsing && region !== "全部" && allD.length > 0 && (
          <><div className="sp-label">② 選擇行政區</div>
            <div className="sp-regions">
              <button className={"sp-region small " + (!district ? "on" : "")} onClick={() => setDistrict("")}>全區 <i>{REGION_COUNT[region]}</i></button>
              {distChips.map((dd) => <button key={dd} className={"sp-region small " + (district === dd ? "on" : "")} onClick={() => setDistrict(dd)}>{dd} <i>{REGION_DISTRICTS[region][dd]}</i></button>)}
              {allD.length > 8 && <button className="sp-region small more" onClick={() => setShowAllDist((v) => !v)}>{showAllDist ? "收合 ▴" : "更多 ▾"}</button>}
            </div></>
        )}
        <div className="sp-count">{result.length === 0 ? "沒有符合的門市" : <>找到 <b>{result.length.toLocaleString()}</b> 間{k ? "（搜尋全台）" : region !== "全部" ? ` · ${region}${district ? " " + district : ""}` : ""}{result.length > CAP ? `（顯示前 ${CAP} 間，請再縮小範圍）` : ""}</>}</div>
      </div>
      {result.length === 0 && <div className="sp-empty"><div className="sp-empty-ic">🔍</div>找不到{q ? `「${q}」相關` : ""}門市<br />試試門市名稱、店號，或「區＋路名」</div>}
      {list.map((s) => (
        <button className="sp-store" key={s.id} onClick={() => setPicked(s)}>
          <div className="sp-store-main"><div className="sp-store-head"><b>{s.name}</b><span className="sp-region-tag">{s.region}</span></div><div className="sp-addr">📍 {s.addr}</div><div className="sp-id mono">店號 {s.id}</div></div>
          <span className="sp-chev">›</span>
        </button>
      ))}
    </div>
  );
}

function ParcelTag({ p, openImage }) {
  return (
    <div className="parcel">
      <div className="punch" />
      {p.photo_url
        ? <img className="parcel-photo" src={p.photo_url} alt="包裹" onClick={() => openImage && openImage(p.photo_url)} />
        : <div className="parcel-photo placeholder">—</div>}
      <div className="parcel-body">
        <div className="parcel-top"><b>{p.product_name}</b><span className={"chip " + STATUS_COLOR[p.status]}>{STATUS_LABEL[p.status]}</span></div>
        <div className="mono small">{p.tracking_no}</div>
        <div className="parcel-meta">{p.weight != null ? <span className="mono">{p.weight} kg</span> : <span className="muted">等待秤重</span>}{p.shelf_code && <span className="shelf">貨架 {p.shelf_code}</span>}</div>
      </div>
    </div>
  );
}
