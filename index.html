.wh-trigger-title{font-size:14.5px;font-weight:700;color:#111827;font-family:'Space Grotesk'}
.wh-trigger-sub{font-size:11.5px;color:#6b7a8e;margin-top:2px;line-height:1.4}
.wh-trigger-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.wh-copy-pill{background:#1B3A6B;color:#fff;border:0;border-radius:20px;
  padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.wh-copy-pill:active{background:#2d5fa8}
.wh-chevron{font-size:11px;color:#9AA5B4;transition:transform .2s;display:block;flex-shrink:0}
.wh-chevron.up{transform:rotate(0deg)}
.wh-body{border-top:1px solid #F1F3F5;padding:14px 16px 16px;background:#FAFBFF}
.wh-member-badge{display:flex;align-items:center;gap:8px;background:#EEF2FF;border-radius:10px;
  padding:9px 12px;margin-bottom:12px;font-size:12.5px;color:#374151;flex-wrap:wrap}
.wh-member-badge b{font-size:15px;color:#1B3A6B;letter-spacing:.5px}
.wh-member-tip{color:#9AA5B4;font-size:11.5px}
.wh-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-top:1px dashed #EAECF0}
.wh-row:first-of-type{border-top:0}
.wh-k{flex-shrink:0;width:46px;font-size:11.5px;color:#9AA5B4;font-weight:600;padding-top:3px;
  letter-spacing:.3px}
.wh-v{flex:1;font-size:14px;color:#111827;line-height:1.55;word-break:break-all}
.wh-copy-btn{flex-shrink:0;background:#F1F3F5;border:0;color:#374151;border-radius:8px;
  padding:5px 11px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;
  transition:all .12s;white-space:nowrap}
.wh-copy-btn:active{background:#DADEEA}
.wh-copy-btn.done{background:#D1FAE5;color:#065F46}
.wh-note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;
  padding:9px 12px;font-size:12.5px;color:#92400E;margin:10px 0;line-height:1.6}
.wh-copy-all-btn{display:block;width:100%;margin-top:12px;background:linear-gradient(135deg,#1B3A6B,#2d5fa8);
  color:#fff;border:0;border-radius:12px;padding:13px;font-size:14.5px;
  font-weight:700;cursor:pointer;font-family:inherit;text-align:center;
  box-shadow:0 4px 12px rgba(27,58,107,.25)}
.wh-copy-all-btn:active{opacity:.9;transform:scale(.98)}

/* ---- 估價入口 ---- */
.calc-card{display:flex;align-items:center;gap:12px;width:100%;
  background:linear-gradient(135deg,#1B3A6B,#2d5fa8);
  color:#fff;border:0;border-radius:16px;padding:14px 16px;margin:14px 0 4px;
  cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 6px 20px rgba(27,58,107,.25)}
.calc-card:active{transform:scale(.98);opacity:.95}
.calc-ic{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.calc-txt{flex:1}
.calc-txt b{font-family:'Space Grotesk';font-size:16px;display:block;margin-bottom:2px}
.calc-txt span{font-size:12px;opacity:.8}
.calc-arrow{font-size:22px;opacity:.6}
.rate-info{font-size:12px;color:#9AA5B4;background:#fff;border-radius:10px;border:1px solid #EAECF0;
  padding:10px 13px;margin:6px 0 14px;line-height:1.6}

/* ---- 包裹標籤 ---- */
.parcel{display:flex;background:#fff;border:1px solid #EAECF0;border-radius:14px;padding:12px;
  margin-bottom:10px;position:relative;align-items:center;gap:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.punch{position:absolute;left:-1px;top:50%;width:14px;height:14px;background:#F7F8FA;
  border:1px solid #EAECF0;border-radius:50%;transform:translate(-50%,-50%)}
.parcel-photo{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:#fff;flex-shrink:0;object-fit:cover;
  overflow:hidden;background:#E5E9F0}
.parcel-photo.placeholder{background:#E5E9F0}
.parcel-body{flex:1;min-width:0}
.parcel-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.parcel-top b{font-size:14.5px;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.parcel-meta{display:flex;gap:10px;align-items:center;margin-top:5px}
.parcel-photo{cursor:zoom-in}
.small{font-size:12px;color:#6b7a8e}.muted{color:#9AA5B4;font-size:12px}
.shelf{font-size:11px;background:#EEF2FF;color:#1B3A6B;padding:2px 8px;border-radius:6px;font-weight:600}

/* ---- chip ---- */
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip-grey{background:#F1F3F5;color:#6B7A8E}
.chip-sea{background:#EEF2FF;color:#1B3A6B}
.chip-alert{background:#FEF2F2;color:#E03E3E}
.chip-leaf{background:#D1FAE5;color:#065F46}

/* ---- tag-card (add pkg) ---- */
.tag-card{position:relative}
.tag-no{position:absolute;right:14px;top:14px;font-family:'Space Grotesk';
  color:#DADEEA;font-weight:700;font-size:18px}
.track-hint{font-size:11.5px;color:#9AA5B4;background:#F7F8FA;border-radius:8px;padding:7px 10px;border:1px solid #EAECF0}

/* ---- 集運出貨 ---- */
.pick{display:flex;gap:12px;background:#fff;border:1.5px solid #EAECF0;border-radius:14px;
  padding:13px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .1s}
.pick.on{border-color:#1B3A6B;background:#F5F8FF}
.pick:active{transform:scale(.99)}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid #DADEEA;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.ck-on{background:#1B3A6B;border-color:#1B3A6B}
.pick-body{flex:1;min-width:0}
.pick-top{display:flex;justify-content:space-between;gap:8px}
.weight-box{display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#111827,#1f2d40);color:#fff;
  border-radius:14px;padding:14px 16px;margin:8px 0 4px}
.weight-box b{font-family:'Space Grotesk';font-size:22px;color:#F5A623}

/* ---- 運送方式 ---- */
.ship-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.ship{background:#fff;border:2px solid #EAECF0;border-radius:14px;padding:14px 12px;
  text-align:left;cursor:pointer;font-family:inherit;transition:all .12s}
.ship b{display:block;font-size:14.5px;color:#111827;margin-bottom:4px;font-weight:700}
.ship span{font-size:11.5px;color:#6b7a8e;line-height:1.4}
.ship.on{border-color:#F5A623;background:#FFFBF0;box-shadow:0 0 0 1px #F5A623}
.ship.disabled{opacity:.4;background:#F7F8FA;cursor:not-allowed;border-color:#EAECF0}
.warn{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:10px;
  padding:10px 13px;font-size:13px;margin:10px 0;line-height:1.5}

/* ---- 付款方式選卡 ---- */
.radio-card{background:#fff;border:2px solid #EAECF0;border-radius:14px;padding:14px;
  margin-bottom:9px;cursor:pointer;transition:all .12s;position:relative}
.radio-card::before{content:'';position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;border-radius:50%;border:2px solid #DADEEA;background:#fff;flex-shrink:0}
.radio-card.on::before{background:#1B3A6B;border-color:#1B3A6B;
  box-shadow:inset 0 0 0 3px #fff}
.radio-card b{font-size:14.5px;color:#111827;display:block;padding-left:28px;font-weight:600}
.radio-card .small{padding-left:28px;margin-top:3px}
.radio-card.on{border-color:#1B3A6B;background:#F5F8FF}
.empty{color:#9AA5B4;font-size:13px;text-align:center;padding:20px;
  border:1.5px dashed #DADEEA;border-radius:12px;line-height:1.7}
.empty.big{padding:52px 18px;font-size:15px}

/* ---- 優惠相關 ---- */
.coupon-row{display:flex;gap:9px}.coupon-row input{flex:1}
.ok,.store-count{color:#065F46;font-size:13px;margin-top:8px;font-weight:600}
.store-count{color:#9AA5B4;font-weight:500;margin:10px 0}
.switch{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #EAECF0;
  border-radius:12px;padding:13px;margin-top:10px;font-size:14px;color:#111827}
.switch input{width:18px;height:18px;accent-color:#1B3A6B;flex-shrink:0}

/* ---- 運費明細 ---- */
.receipt{background:#fff;border:1px solid #EAECF0;border-radius:16px;padding:16px;
  margin:14px 0 8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.receipt-h{font-family:'Space Grotesk';font-weight:700;font-size:14px;color:#111827;
  margin-bottom:12px;letter-spacing:.2px}
.rl{display:flex;justify-content:space-between;font-size:13.5px;color:#374151;padding:5px 0}
.rl.disc{color:#065F46}
.perf{border-top:2px dashed #EAECF0;margin:10px -16px}
.rl.total{font-size:17px;font-weight:700;color:#111827;padding-top:10px}
.rl.total .mono{color:#c97800;font-size:20px}
.round-note{font-size:11px;color:#9AA5B4;margin-top:8px}
.rate-note{margin-top:10px;background:#F5F8FF;border:1px solid #C7D4EE;border-radius:10px;
  padding:10px 13px;font-size:12px;color:#374151;line-height:1.7}
.rate-note b{color:#1B3A6B}
.info-tip{background:#FFFBF0;border:1px solid #FDE68A;color:#92400E;
  border-radius:10px;padding:10px 13px;font-size:12.5px;margin:8px 0 4px;line-height:1.6}

/* ---- QR / 上傳 ---- */
.qr-box{background:#fff;border:1px solid #EAECF0;border-radius:16px;padding:16px;margin-bottom:14px}
.qr{width:160px;height:190px;margin:0 auto 12px;border:2px solid var(--c);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.qr-grid{width:120px;height:120px;background:
  repeating-linear-gradient(0deg,#1B3A6B 0 7px,#fff 7px 14px),
  repeating-linear-gradient(90deg,#1B3A6B 0 7px,transparent 7px 14px);
  background-blend-mode:multiply;border-radius:6px;opacity:.85}
.qr-cap{font-size:13px;font-weight:600;color:var(--c)}
.qr-img{width:170px;height:auto;border-radius:12px;display:block;margin:0 auto 12px}
.upload{display:flex;align-items:center;justify-content:center;border:2px dashed #DADEEA;
  border-radius:12px;height:120px;margin-top:12px;color:#9AA5B4;font-size:14px;
  overflow:hidden;cursor:pointer;background:#FAFBFC;transition:border .12s}
.upload:active{border-color:#1B3A6B}
.upload img{width:100%;height:100%;object-fit:cover}

/* ---- 訂單進度 ---- */
.order{background:#fff;border:1px solid #EAECF0;border-radius:16px;padding:16px;
  margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.order-h{display:flex;justify-content:space-between;align-items:center}
.order-h .mono{font-size:15px;font-weight:700;color:#111827}
.order-meta{font-size:12px;color:#9AA5B4;margin:6px 0 12px;line-height:1.5}
.order-items{border-top:1px solid #F1F3F5;border-bottom:1px solid #F1F3F5;padding:8px 0;margin-bottom:10px}
.oi{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;color:#374151}
.order-pay{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-pay b{font-size:20px;color:#c97800;font-family:'Space Grotesk'}
.ship-block{background:#F5F8FF;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #DADEEA}
.out-photo{width:100%;max-width:280px;border-radius:10px;display:block;margin-bottom:8px;cursor:zoom-in}
.alert-box{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:10px;
  padding:10px 13px;font-size:13px;margin:8px 0;line-height:1.6}
.ship-photo{height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:600;margin-bottom:10px}
.note-3d{font-size:12.5px;color:#374151;background:#F5F8FF;border-radius:8px;
  padding:9px 12px;line-height:1.6;border:1px solid #DADEEA}

/* ---- 鈴鐺通知 ---- */
.bell{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:20;
  width:42px;height:42px;border-radius:50%;border:1px solid #EAECF0;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;
  align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.bell-dot{position:absolute;top:-3px;right:-3px;background:#E03E3E;color:#fff;
  border-radius:11px;min-width:20px;height:20px;font-size:10px;font-weight:700;
  font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px;
  border:2px solid #F7F8FA}
.notif-wrap{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;justify-content:flex-end}
.notif-panel{width:88%;max-width:360px;background:#fff;height:100%;display:flex;flex-direction:column;
  animation:slideIn .2s ease-out;overflow:hidden}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.notif-head{display:flex;justify-content:space-between;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid #F1F3F5;
  font-family:'Space Grotesk';font-size:17px;font-weight:700;color:#111827}
.notif-head .x{border:0;background:#F1F3F5;color:#6b7a8e;font-size:14px;cursor:pointer;
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.notif{display:flex;gap:10px;width:100%;border:0;background:0;padding:14px 16px;
  border-bottom:1px solid #F7F8FA;text-align:left;font-family:inherit;cursor:pointer;
  position:relative;align-items:flex-start}
.notif:active{background:#F5F8FF}
.notif.unread{background:#FAFCFF}
.ni-i{font-size:22px;flex-shrink:0;margin-top:1px}
.ni-body{flex:1;min-width:0}
.ni-t{font-weight:600;color:#111827;font-size:14px;margin-bottom:3px}
.ni-b{color:#374151;font-size:12.5px;line-height:1.55}
.ni-time{color:#9AA5B4;font-size:11px;margin-top:5px}
.ni-dot{position:absolute;right:14px;top:18px;width:7px;height:7px;
  background:#E03E3E;border-radius:50%;font-style:normal}

/* ---- 圖片放大 ---- */
.lightbox{position:absolute;inset:0;background:rgba(0,0,0,.93);z-index:70;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:96%;max-height:90%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb-close{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;
  width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);
  color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}

/* ---- 個人中心 ---- */
.profile-top{display:flex;align-items:center;gap:13px;margin:4px 0 16px;
  background:#fff;border:1px solid #EAECF0;border-radius:16px;padding:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.04)}
.avatar{width:50px;height:50px;border-radius:16px;
  background:linear-gradient(135deg,#1B3A6B,#2d5fa8);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;font-family:'Space Grotesk';flex-shrink:0}
.pname{font-family:'Space Grotesk';font-size:18px;font-weight:700;color:#111827}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.duo-c{background:#fff;border:1px solid #EAECF0;border-radius:14px;padding:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.duo-c span{font-size:12px;color:#6b7a8e;display:block;margin-bottom:3px}
.duo-c b{font-family:'Space Grotesk';font-size:24px;color:#1B3A6B;display:block;font-weight:700}
.duo-c i{font-size:11px;color:#9AA5B4;font-style:normal}
.duo-c.gold b{color:#c97800}
.menu-item{display:flex;align-items:center;gap:13px;width:100%;background:#fff;
  border:1px solid #EAECF0;border-radius:14px;padding:14px;margin-bottom:10px;
  cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:all .1s}
.menu-item:active{background:#F5F8FF;transform:scale(.99)}
.menu-item.invite{background:linear-gradient(100deg,#FFFBF0,#FFF3D6);border-color:#FDE68A}
.mi-ic{width:38px;height:38px;border-radius:11px;background:#F5F8FF;display:flex;
  align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.menu-item.invite .mi-ic{background:rgba(255,255,255,.7)}
.mi-txt{flex:1}
.mi-txt b{font-size:15px;color:#111827;display:block;font-weight:600}
.mi-txt i{font-size:12px;color:#9AA5B4;font-style:normal;margin-top:2px;display:block}
.mi-arrow{font-size:20px;color:#C4CAD6}
.addr-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.addr-btns .btn{font-size:13px;padding:12px 8px;text-align:center}
.addr{display:flex;align-items:center;gap:11px;position:relative}
.addr .x{position:absolute;right:10px;top:10px;border:0;background:#F1F3F5;
  color:#6b7a8e;font-size:12px;cursor:pointer;width:26px;height:26px;
  border-radius:7px;display:flex;align-items:center;justify-content:center}

/* ---- 邀請頁 ---- */
.invite-hero{background:linear-gradient(135deg,#F5A623,#e8911a);color:#fff;
  border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(245,166,35,.35)}
.ih-big{font-size:44px;margin-bottom:4px}
.invite-hero h3{font-family:'Space Grotesk';margin:4px 0 8px;font-size:20px;font-weight:700}
.invite-hero p{font-size:13px;line-height:1.7;opacity:.95;margin:0}
.invite-hero b{font-size:15px}
.invite-link{display:flex;gap:9px;align-items:center;background:#fff;
  border:1.5px dashed #DADEEA;border-radius:12px;padding:11px 13px}
.invite-link span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151;font-size:13.5px}
.invite-code{text-align:center;font-size:14px;color:#6b7a8e;margin:12px 0}
.invite-code b{font-size:19px;color:#111827;letter-spacing:1.5px;margin-left:6px;font-family:'Space Mono',monospace}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.share{border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:600;
  color:#fff;font-family:inherit;cursor:pointer}
.share.line{background:#06C755}.share.fb{background:#1877F2}

/* ---- 關於我們 ---- */
.about-hero{text-align:center;padding:8px 0 6px}
.logo.sm{width:54px;height:54px;font-size:26px;border-radius:16px;margin:0 auto 10px}
.about-hero h3{font-family:'Space Grotesk';font-size:22px;color:#111827;margin:0 0 8px;font-weight:700}
.slogan{font-size:13.5px;color:#1B3A6B;line-height:1.7;margin:0 14px;font-weight:500}
.about-p{font-size:13.5px;color:#374151;line-height:1.85;margin:14px 0}
.adv{display:flex;gap:13px;background:#fff;border:1px solid #EAECF0;border-radius:14px;
  padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.adv-n{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#F5A623;flex-shrink:0}
.adv b{font-size:14.5px;color:#111827;font-weight:600}
.about-foot{text-align:center;font-size:11.5px;color:#9AA5B4;margin:18px 0 4px}
.logo-plate{background:#fff;border-radius:18px;padding:16px 20px;box-shadow:0 8px 24px rgba(0,0,0,.12);
  display:inline-block;margin:6px auto 0}
.logo-plate img{display:block;width:230px;max-width:62vw;height:auto}
.about-logo{display:block;width:220px;max-width:70%;height:auto;margin:6px auto 4px}

/* ---- 底部導覽 ---- */
.tabbar{display:flex;align-items:center;justify-content:space-around;
  background:#fff;border-top:1px solid #EAECF0;padding:6px 4px 10px;position:relative;
  box-shadow:0 -2px 12px rgba(0,0,0,.05)}
.tabbar button{border:0;background:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:#9AA5B4;font-family:inherit;flex:1;cursor:pointer;
  padding:6px 0;border-radius:12px;transition:all .12s;position:relative}
.tabbar button:active{background:#F5F8FF}
